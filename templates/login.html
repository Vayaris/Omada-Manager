<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omada Manager - Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-top-bar">
        <button class="btn btn-sm btn-icon" onclick="toggleLang()" id="langBtn" title="Switch language">
            <span id="langLabel">EN</span>
        </button>
        <button class="btn btn-sm btn-icon" onclick="toggleTheme()" id="themeBtn">
            <svg id="themeIconSun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none">
                <circle cx="8" cy="8" r="3.5"/>
                <path d="M8 0v2M8 14v2M0 8h2M14 8h2M2.3 2.3l1.4 1.4M12.3 12.3l1.4 1.4M2.3 13.7l1.4-1.4M12.3 3.7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg id="themeIconMoon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6 1a7 7 0 1 0 8.4 8.4A5.5 5.5 0 0 1 6 1z"/>
            </svg>
        </button>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="#4285f4"/>
                    <path d="M14 24 L22 32 L34 16" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Omada Manager</h1>
            <p data-i18n="login_subtitle">Gestion du service Omada Network Application</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username" data-i18n="username_label">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="" data-i18n-placeholder="username_placeholder">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="password_label">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       placeholder="" data-i18n-placeholder="password_placeholder">
            </div>
            <button type="submit" class="btn btn-primary btn-full" data-i18n="login_btn">Se connecter</button>
        </form>
    </div>

    <script>
    const LANG = {
        fr: {
            login_subtitle: "Gestion du service Omada Network Application",
            username_label: "Nom d'utilisateur",
            password_label: "Mot de passe",
            username_placeholder: "Identifiant système",
            password_placeholder: "Mot de passe",
            login_btn: "Se connecter"
        },
        en: {
            login_subtitle: "Omada Network Application Management",
            username_label: "Username",
            password_label: "Password",
            username_placeholder: "System username",
            password_placeholder: "Password",
            login_btn: "Sign in"
        }
    };

    let currentLang = localStorage.getItem('omada_lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en');
    let currentTheme = localStorage.getItem('omada_theme') || 'dark';

    function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (LANG[currentLang][key]) el.innerHTML = LANG[currentLang][key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (LANG[currentLang][key]) el.placeholder = LANG[currentLang][key];
        });
        document.getElementById('langLabel').textContent = currentLang === 'fr' ? 'EN' : 'FR';
        localStorage.setItem('omada_lang', currentLang);
    }

    function toggleLang() {
        currentLang = currentLang === 'fr' ? 'en' : 'fr';
        applyLang();
    }

    function applyTheme() {
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeIconSun').style.display = currentTheme === 'dark' ? 'none' : 'block';
        document.getElementById('themeIconMoon').style.display = currentTheme === 'dark' ? 'block' : 'none';
        localStorage.setItem('omada_theme', currentTheme);
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme();
    }

    applyTheme();
    applyLang();
    </script>
</body>
</html>
